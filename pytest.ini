[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Tests requiring asyncio

log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
